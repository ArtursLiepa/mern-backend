apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: reactappclouddb:1.0
        ports:
        - containerPort: 3005
        env:
        - name: CLDB_URL
          valueFrom:
            configMapKeyRef:
              name: backend-configmap
              key: CLDB_URL
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 3005
    targetPort: 3005
